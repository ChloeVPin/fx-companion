name: Feature request
description: Propose a focused improvement to fx-companion
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: stock_contract
    attributes:
      label: Stock fx compatibility
      description: How can this preserve stock output, ordering, metadata, fallbacks, and the `FX_NO_COMPANION=1` escape hatch?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is about fx-companion rather than a general upstream fx feature.
          required: true
