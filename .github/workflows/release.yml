name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        run: |
          set -euo pipefail
          URL="https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
          SHA256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl --fail --silent --show-error --location "$URL" -o /tmp/zig.tar.xz
          printf '%s  %s\n' "$SHA256" /tmp/zig.tar.xz | shasum -a 256 -c -
          ZIG_DIR="$RUNNER_TEMP/zig-0.16.0"
          mkdir -p "$ZIG_DIR"
          tar -xJf /tmp/zig.tar.xz -C "$ZIG_DIR" --strip-components=1
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          export PATH="$ZIG_DIR:$PATH"
          zig version

      - name: Pin upstream fx
        id: pin
        run: |
          COMMIT=$(cat PINNED_FX)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "building against vercel-labs/fx@$COMMIT"

      - name: Clone upstream fx
        run: git -c http.userAgent="fx-companion-release" clone https://github.com/vercel-labs/fx fx-src && git -C fx-src checkout "${{ steps.pin.outputs.commit }}"

      - name: Build pristine pinned workspace fingerprint
        run: |
          set -euo pipefail
          cp benchmarks/workspace_dump.zig fx-src/src/fx_companion_workspace_dump.zig
          (
            cd fx-src
            zig build-exe src/fx_companion_workspace_dump.zig -lc -OReleaseFast -femit-bin=/tmp/workspace-dump-pristine
          )

      - name: Inject fx-companion
        run: |
          set -euo pipefail
          python3 product/inject_hook.py fx-src
          (
            cd fx-src
            zig build-exe src/fx_companion_workspace_dump.zig -lc -OReleaseFast -femit-bin=/tmp/workspace-dump-injected
          )

      - name: Pristine vs injected workspace fingerprints
        run: |
          set -euo pipefail
          ROOT=$(mktemp -d /tmp/fxc-release-diff-root.XXXXXX)
          CACHE=$(mktemp -d /tmp/fxc-release-diff-cache.XXXXXX)
          trap 'rm -rf -- "$ROOT" "$CACHE"' EXIT

          mkdir -p "$ROOT/src/deep" "$ROOT/vendor/pkg" "$ROOT/.hidden/deep"
          printf 'alpha\n' > "$ROOT/a.txt"
          printf 'beta\n' > "$ROOT/src/deep/b.txt"
          printf 'ignored\n' > "$ROOT/vendor/pkg/ignored.txt"
          printf 'hidden\n' > "$ROOT/.hidden/deep/secret.txt"
          printf 'vendor/\n' > "$ROOT/.gitignore"
          ln -s a.txt "$ROOT/link_to_a"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -- .gitignore a.txt src .hidden link_to_a
          git -C "$ROOT" -c user.email=fxc@test -c user.name=fxc -c commit.gpgsign=false commit -qm init

          pristine_git="$(FX_COMPANION_HOME="$CACHE" /tmp/workspace-dump-pristine "$ROOT" git 100000 2>&1)"
          injected_git_cold="$(FX_COMPANION_HOME="$CACHE" /tmp/workspace-dump-injected "$ROOT" git 100000 2>&1)"
          test -n "$(find "$CACHE/snapshots" -maxdepth 1 -type f -print -quit 2>/dev/null)"
          injected_git_warm="$(FX_COMPANION_HOME="$CACHE" /tmp/workspace-dump-injected "$ROOT" git 100000 2>&1)"
          test "$pristine_git" = "$injected_git_cold"
          test "$pristine_git" = "$injected_git_warm"

          rm -rf "$CACHE" && mkdir -p "$CACHE"
          pristine_recursive="$(FX_COMPANION_HOME="$CACHE" /tmp/workspace-dump-pristine "$ROOT" recursive 600000 2>&1)"
          injected_recursive_cold="$(FX_COMPANION_HOME="$CACHE" /tmp/workspace-dump-injected "$ROOT" recursive 600000 2>&1)"
          test -n "$(find "$CACHE/snapshots" -maxdepth 1 -type f -print -quit 2>/dev/null)"
          injected_recursive_warm="$(FX_COMPANION_HOME="$CACHE" /tmp/workspace-dump-injected "$ROOT" recursive 600000 2>&1)"
          test "$pristine_recursive" = "$injected_recursive_cold"
          test "$pristine_recursive" = "$injected_recursive_warm"

          printf 'git fingerprint: %s\n' "$pristine_git"
          printf 'git warm fingerprint: %s\n' "$injected_git_warm"
          printf 'recursive fingerprint: %s\n' "$pristine_recursive"
          printf 'recursive warm fingerprint: %s\n' "$injected_recursive_warm"

      - name: Installer smoke test
        run: node product/cli_smoke_test.js

      - name: Package metadata smoke test
        run: |
          node --check cli.js
          npm pack --dry-run --json > /tmp/fxc-npm-pack.json
          node - <<'NODE'
          const packs = require('/tmp/fxc-npm-pack.json');
          const files = new Set(packs[0].files.map((entry) => entry.path));
          for (const required of [
            'cli.js', 'NOTICE', 'PINNED_FX', 'product/fx_companion.zig',
            'product/inject_hook.py', 'product/fxc',
            'product/tests_fxcompanion.zig', 'product/install.sh',
            'product/sync.sh',
          ]) {
            if (!files.has(required)) throw new Error(`npm package missing ${required}`);
          }
          NODE
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PACKAGE_TAG="v$(node -p "require('./package.json').version")"
            test "$PACKAGE_TAG" = "$GITHUB_REF_NAME"
          fi

      - name: Equivalence self-test (byte-identical or bust)
        run: |
          zig build-exe benchmarks/make_anchor.zig -lc -OReleaseFast -femit-bin=/tmp/make-anchor
          cp product/tests_fxcompanion.zig fx-src/src/tests_fxcompanion.zig
          cp benchmarks/concurrent_cache_probe.zig fx-src/src/fx_companion_concurrent_cache_probe.zig
          cp benchmarks/cancellation_probe.zig fx-src/src/fx_companion_cancellation_probe.zig
          cp benchmarks/git_cache_probe.zig fx-src/src/fx_companion_git_cache_probe.zig
          cp benchmarks/tooling/benchmark_runner.zig fx-src/src/fx_companion_benchmark_runner.zig
          cp benchmarks/tooling/profile_run.zig fx-src/src/fx_companion_profile_run.zig
          cd fx-src
          zig build-exe src/tests_fxcompanion.zig -lc -OReleaseFast -femit-bin=/tmp/equiv-probe
          zig build-exe src/fx_companion_concurrent_cache_probe.zig -lc -OReleaseFast -femit-bin=/tmp/concurrent-cache-probe
          zig build-exe src/fx_companion_cancellation_probe.zig -lc -OReleaseFast -femit-bin=/tmp/cancellation-probe
          zig build-exe src/fx_companion_git_cache_probe.zig -lc -OReleaseFast -femit-bin=/tmp/git-cache-probe
          zig build-exe src/fx_companion_benchmark_runner.zig -lc -OReleaseFast -femit-bin=/tmp/benchmark-runner
          zig build-exe src/fx_companion_profile_run.zig -lc -OReleaseFast -femit-bin=/tmp/profile-runner

          TINY=$(mktemp -d /tmp/fxc-tiny.XXXXXX)
          CAPPED=$(mktemp -d /tmp/fxc-capped.XXXXXX)
          EMPTY=$(mktemp -d /tmp/fxc-empty.XXXXXX)
          DEEP=$(mktemp -d /tmp/fxc-deep.XXXXXX)
          trap 'rm -rf -- "$TINY" "$CAPPED" "$EMPTY" "$DEEP"' EXIT

          mkdir -p "$TINY/src/deep" "$TINY/node_modules/pkg" \
                   "$TINY/.hidden/deep" "$TINY/ignored/deep"
          touch "$TINY/a.txt" "$TINY/b.log" "$TINY/.dotfile" \
                "$TINY/src/main.zig" "$TINY/src/deep/x.zig" \
                "$TINY/node_modules/pkg/index.js" \
                "$TINY/.hidden/deep/secret.txt" "$TINY/ignored/deep/nope.txt"
          mkfifo "$TINY/not-a-regular-file"
          ln -s a.txt "$TINY/link_to_a"
          ln -s src "$TINY/dirlink"
          git -C "$TINY" init -q
          printf 'ignored/\n' > "$TINY/.gitignore"
          git -C "$TINY" add -- .gitignore a.txt b.log .dotfile src .hidden node_modules link_to_a dirlink
          git -C "$TINY" -c user.email=fxc@test -c user.name=fxc -c commit.gpgsign=false commit -qm init

          for dir in a b c d; do
            mkdir -p "$CAPPED/$dir"
            for file in $(seq -w 0 39); do
              touch "$CAPPED/$dir/f$file"
            done
          done
          (
            cd "$DEEP"
            for index in $(seq -w 1 230); do
              mkdir "segment$index"
              cd "segment$index"
            done
            touch leaf.txt
          )
          /tmp/equiv-probe "$TINY" 100000 --mutation-check
          /tmp/equiv-probe "$CAPPED" 50 --mutation-check
          /tmp/equiv-probe "$EMPTY" 0
          /tmp/equiv-probe "$DEEP" 100000
          test -d /opt/homebrew
          /tmp/equiv-probe /opt/homebrew 600000
          /tmp/concurrent-cache-probe "$TINY" 1000
          /tmp/cancellation-probe /opt/homebrew 100
          /tmp/profile-runner "$TINY"
          /tmp/git-cache-probe "$TINY" --clear
          /tmp/git-cache-probe "$TINY"
          rm -f src/tests_fxcompanion.zig \
                src/fx_companion_concurrent_cache_probe.zig \
                src/fx_companion_cancellation_probe.zig \
                src/fx_companion_git_cache_probe.zig \
                src/fx_companion_benchmark_runner.zig \
                src/fx_companion_profile_run.zig

      - name: Build (ReleaseFast)
        run: cd fx-src && zig build -Doptimize=ReleaseFast

      - name: Side-by-side benchmark gate
        run: |
          BENCH_TREE=$(mktemp -d /tmp/fxc-benchmark.XXXXXX)
          trap 'rm -rf -- "$BENCH_TREE"' EXIT
          /tmp/make-anchor "$BENCH_TREE/tree" 1024 100
          /tmp/benchmark-runner "$BENCH_TREE/tree" 2>&1 | tee /tmp/fxc-benchmark.txt
          grep -q 'correctness: PASS' /tmp/fxc-benchmark.txt
          if grep -q 'companion LOST' /tmp/fxc-benchmark.txt; then
            echo 'fx-companion lost the median comparison' >&2
            exit 1
          fi
          python3 - /tmp/fxc-benchmark.txt "${{ steps.pin.outputs.commit }}" "$GITHUB_SHA" > /tmp/BENCHMARK.json <<'PY'
          import json
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()

          def one(pattern):
              match = re.search(pattern, text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"missing benchmark field: {pattern}")
              return match.group(1)

          median = re.search(r"^median\s+([0-9.]+) ms\s+([0-9.]+) ms\s+([0-9.]+)x$", text, re.MULTILINE)
          correctness = re.search(r"^correctness: PASS - .* paths=(\d+), path_bytes=(\d+), metadata matched$", text, re.MULTILINE)
          if not median or not correctness:
              raise SystemExit("could not parse release benchmark")

          data = {
              "schema": 1,
              "companion_commit": sys.argv[3],
              "upstream_fx_commit": sys.argv[2],
              "runner": "github-actions-macos-15",
              "workload": "1024 directories x 100 files",
              "rounds": 7,
              "candidate_cap": 600000,
              "paths": int(correctness.group(1)),
              "path_bytes": int(correctness.group(2)),
              "stock_median_ms": float(median.group(1)),
              "warm_median_ms": float(median.group(2)),
              "warm_speedup": float(median.group(3)),
              "correctness": "byte-identical",
          }
          json.dump(data, sys.stdout, indent=2, sort_keys=True)
          sys.stdout.write("\n")
          PY
          cat /tmp/BENCHMARK.json

      - name: Package
        id: package
        run: |
          set -euo pipefail
          cp fx-src/zig-out/bin/fx fx
          chmod +x fx
          cp /tmp/BENCHMARK.json BENCHMARK.json
          TAG="${GITHUB_REF_NAME:-dev}"
          ASSET="fx-companion-macos-arm64-${TAG}.tar.gz"
          tar -czf "$ASSET" fx
          shasum -a 256 "$ASSET" LICENSE NOTICE BENCHMARK.json > SHA256SUMS
          {
            echo "fx-companion release provenance"
            echo "release_tag=$TAG"
            echo "companion_commit=$GITHUB_SHA"
            echo "upstream_fx_commit=$(tr -d '[:space:]' < PINNED_FX)"
            echo "zig_version=$(zig version)"
            echo "zig_archive_sha256=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
            echo "asset_sha256=$(awk '{print $1}' SHA256SUMS)"
          } > PROVENANCE.txt
          {
            echo "Make fx dramatically faster on Apple Silicon. Same fx. Same results. No fork."
            echo
            echo "## Highlights"
            echo
            echo "- Same upstream fx: built from the explicit PINNED_FX commit, not a replacement CLI."
            echo "- Same results: pristine upstream and fx-companion discovery must match byte-for-byte before release."
            echo "- Fail closed: unsupported or unprovable cases stay on the stock path."
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "npx github:ChloeVPin/fx-companion#$TAG"
            echo '```'
            echo
            echo "Supported target: macOS on Apple Silicon arm64. Existing unrelated fx executables are not moved or replaced."
            echo
            echo "## Release benchmark"
            echo
            echo "Generated CI workload, stock vs fx-companion. Full correctness gates run before packaging."
            echo
            echo '```text'
            awk '/^median[[:space:]]/{print} /^best[[:space:]]/{print} /^correctness:/{print}' /tmp/fxc-benchmark.txt
            echo '```'
            echo
            echo "The same measurement is attached as BENCHMARK.json."
            echo
            echo "## Safety"
            echo
            echo "- Set FX_NO_COMPANION=1 to force stock behavior."
            echo "- Pristine pinned-upstream and injected discovery fingerprints must match for Git and recursive cold/warm paths."
            echo "- SHA256SUMS is verified before publishing and release assets are never overwritten in place."
            echo
            echo "## Provenance"
            echo
            echo '```text'
            cat PROVENANCE.txt
            echo '```'
            echo
            echo "GitHub also records a build provenance attestation for the release tarball."
          } > RELEASE_NOTES.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Attest release binary
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.asset }}

      - name: Preserve release assets for publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.package.outputs.asset }}
            SHA256SUMS
            LICENSE
            NOTICE
            PROVENANCE.txt
            BENCHMARK.json
            RELEASE_NOTES.md

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          test "$TAG" = "$GITHUB_REF_NAME"
          test -f "release-assets/$ASSET"
          test -f release-assets/SHA256SUMS
          test -f release-assets/LICENSE
          test -f release-assets/NOTICE
          test -f release-assets/PROVENANCE.txt
          test -f release-assets/BENCHMARK.json
          test -f release-assets/RELEASE_NOTES.md
          (cd release-assets && shasum -a 256 -c SHA256SUMS)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "fx-companion $TAG" \
            --notes-file release-assets/RELEASE_NOTES.md
          gh release upload "$TAG" \
            "release-assets/$ASSET" \
            release-assets/SHA256SUMS \
            release-assets/LICENSE \
            release-assets/NOTICE \
            release-assets/PROVENANCE.txt \
            release-assets/BENCHMARK.json \
            -R "$GITHUB_REPOSITORY"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
