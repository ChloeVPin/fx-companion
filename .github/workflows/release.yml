name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          # Try ziglang.org first, fall back to Homebrew.
          URL="https://ziglang.org/download/0.16.0/zig-macos-aarch64-0.16.0.tar.xz"
          if curl -fsSL "$URL" -o /tmp/zig.tar.xz 2>/dev/null; then
            mkdir -p /usr/local/opt/zig
            tar -xJf /tmp/zig.tar.xz -C /usr/local/opt/zig --strip-components=1
            echo "/usr/local/opt/zig" >> "$GITHUB_PATH"
          else
            brew install zig
          fi
          zig version

      - name: Pin upstream fx
        id: pin
        run: |
          COMMIT=$(cat PINNED_FX)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "building against vercel-labs/fx@$COMMIT"

      - name: Clone upstream fx
        run: git clone https://github.com/vercel-labs/fx fx-src && git -C fx-src checkout "${{ steps.pin.outputs.commit }}"

      - name: Inject booster
        run: python3 product/inject_hook.py fx-src

      - name: Equivalence self-test (byte-identical or bust)
        run: |
          zig build-exe benchmarks/make_anchor.zig -lc -OReleaseFast -femit-bin=/tmp/make-anchor
          cp product/tests_fxcompanion.zig fx-src/src/tests_fxcompanion.zig
          cp benchmarks/concurrent_cache_probe.zig fx-src/src/fx_companion_concurrent_cache_probe.zig
          cp benchmarks/cancellation_probe.zig fx-src/src/fx_companion_cancellation_probe.zig
          cp benchmarks/profile_output_probe.zig fx-src/src/fx_companion_profile_output_probe.zig
          cd fx-src
          zig build-exe src/tests_fxcompanion.zig -lc -OReleaseFast -femit-bin=/tmp/equiv-probe
          zig build-exe src/fx_companion_concurrent_cache_probe.zig -lc -OReleaseFast -femit-bin=/tmp/concurrent-cache-probe
          zig build-exe src/fx_companion_cancellation_probe.zig -lc -OReleaseFast -femit-bin=/tmp/cancellation-probe
          zig build-exe src/fx_companion_profile_output_probe.zig -lc -OReleaseFast -femit-bin=/tmp/profile-output-probe

          TINY=$(mktemp -d /tmp/fxc-tiny.XXXXXX)
          CAPPED=$(mktemp -d /tmp/fxc-capped.XXXXXX)
          EMPTY=$(mktemp -d /tmp/fxc-empty.XXXXXX)
          DEEP=$(mktemp -d /tmp/fxc-deep.XXXXXX)
          PROFILE_PARENT=$(mktemp -d /tmp/fxc-profile.XXXXXX)
          PROFILE_LARGE="$PROFILE_PARENT/tree"
          trap 'rm -rf -- "$TINY" "$CAPPED" "$EMPTY" "$DEEP" "$PROFILE_PARENT"' EXIT

          mkdir -p "$TINY/src/deep" "$TINY/node_modules/pkg" \
                   "$TINY/.hidden/deep" "$TINY/ignored/deep"
          touch "$TINY/a.txt" "$TINY/b.log" "$TINY/.dotfile" \
                "$TINY/src/main.zig" "$TINY/src/deep/x.zig" \
                "$TINY/node_modules/pkg/index.js" \
                "$TINY/.hidden/deep/secret.txt" "$TINY/ignored/deep/nope.txt"
          mkfifo "$TINY/not-a-regular-file"
          ln -s a.txt "$TINY/link_to_a"
          ln -s src "$TINY/dirlink"
          git -C "$TINY" init -q
          printf 'ignored/\n' > "$TINY/.gitignore"

          for dir in a b c d; do
            mkdir -p "$CAPPED/$dir"
            for file in $(seq -w 0 39); do
              touch "$CAPPED/$dir/f$file"
            done
          done
          (
            cd "$DEEP"
            for index in $(seq -w 1 230); do
              mkdir "segment$index"
              cd "segment$index"
            done
            touch leaf.txt
          )
          /tmp/make-anchor "$PROFILE_LARGE" 101 100

          /tmp/equiv-probe "$TINY" 100000 --mutation-check
          /tmp/equiv-probe "$CAPPED" 50 --mutation-check
          /tmp/equiv-probe "$EMPTY" 0
          /tmp/equiv-probe "$DEEP" 100000
          test -d /opt/homebrew
          /tmp/equiv-probe /opt/homebrew 600000
          /tmp/concurrent-cache-probe "$TINY" 1000
          /tmp/cancellation-probe /opt/homebrew 100
          /tmp/profile-output-probe "$TINY" --require-full
          /tmp/profile-output-probe "$PROFILE_LARGE" --require-responsive
          rm -f src/tests_fxcompanion.zig \
                src/fx_companion_concurrent_cache_probe.zig \
                src/fx_companion_cancellation_probe.zig \
                src/fx_companion_profile_output_probe.zig

      - name: Build (ReleaseFast)
        run: cd fx-src && zig build -Doptimize=ReleaseFast

      - name: Side-by-side benchmark gate
        run: |
          BENCH_TREE=$(mktemp -d /tmp/fxc-benchmark.XXXXXX)
          trap 'rm -rf -- "$BENCH_TREE"' EXIT
          /tmp/make-anchor "$BENCH_TREE/tree" 1024 100
          fx-src/zig-out/bin/fx --fx-companion-benchmark "$BENCH_TREE/tree" 2>&1 | tee /tmp/fxc-benchmark.txt
          grep -q 'correctness: PASS' /tmp/fxc-benchmark.txt
          if grep -q 'boosted LOST' /tmp/fxc-benchmark.txt; then
            echo 'boosted implementation lost the median comparison' >&2
            exit 1
          fi

      - name: Package
        run: |
          cp fx-src/zig-out/bin/fx fx
          chmod +x fx
          TAG="${GITHUB_REF_NAME:-v0.0.0-dev}"
          tar -czf "fx-boosted-macos-arm64-${TAG}.tar.gz" fx
          shasum -a 256 "fx-boosted-macos-arm64-${TAG}.tar.gz" > SHA256SUMS
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "fx-boosted-macos-arm64-${TAG}.tar.gz" SHA256SUMS \
            -R "$GITHUB_REPOSITORY" \
            --title "$TAG — boosted fx (auto-built)" \
            --notes "Built in CI from vercel-labs/fx@$(cat PINNED_FX) with the booster injected. Equivalence self-test passed before packaging." \
            || gh release upload "$TAG" \
            "fx-boosted-macos-arm64-${TAG}.tar.gz" SHA256SUMS \
            -R "$GITHUB_REPOSITORY" --clobber
